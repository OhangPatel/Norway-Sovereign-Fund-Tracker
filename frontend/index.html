    <style>
      /* ============================================================
         "LIME" DESIGN SYSTEM — see STYLE_GUIDE.md (single source of truth)
         Light is default; [data-theme="dark"] inverts.
         UI 2.0: light = "Olive wash", dark = "Ink field".
         ============================================================ */
      /* The nav card keeps the same look in both themes — only its surface and
         the ticker band flip — so its text colours are theme-independent and
         cannot inherit --ink, which is cream on the ink field. */
      :root {
        --nav-ink: #16170F;
        --nav-sub: #6F6D5F;
        /* Was #A3A88F — 2.25:1 light, 2.13:1 dark: the worst contrast in the app, and
           on the masthead ("Norway GPFG · Equity Holdings · <date>"). Because this token
           is shared by both themes, one value has to clear all four nav backgrounds;
           this does, at 5.01-5.77:1. Hue and saturation unchanged. */
        --nav-soft: #646851;
        --nav-accent-text: #6C8118;
      }

      :root[data-theme="light"] {
        /* — canonical Lime tokens — OLIVE WASH */
        --bg: #E3E8CE;
        --surface: #FFFFFF;
        --line: #E3E8D3;
        /* Bar rails read as the card border, not a separate grey. */
        --track: #E3E8D3;

        --ink: #16170F;
        /* Was #6F6D5F — 4.15:1 on --bg, a marginal AA failure alongside --soft below.
           Hue and saturation unchanged; now 5.03:1 on --bg. */
        --sub: #626054;
        /* Secondary text: eyebrows, captions, table meta — mostly 9-11px, so WCAG's
           4.5:1 "normal text" bar applies, not the 3:1 large-text one. #A3A88F scored
           1.95:1 on --bg, which is close to invisible with low vision or in sunlight.
           Hue (72deg) and saturation (13%) are unchanged — only lightness moved — so
           the palette keeps its character. Now 5.02:1 on --bg, 5.78 on --row-hover,
           6.31 on --surface. Re-check all three if any of those backgrounds change. */
        --soft: #5E624C;

        --accent: #D8F34A;
        --accent-text: #6C8118;

        --feature: #14150F;
        --feature-ink: #F4F2EC;
        --feature-sub: #8F9180;
        --feature-num: #D8F34A;

        --row-hover: #F4F6EA;
        --card-hover-border: #16170F;

        /* Nav shell — the floating card sits above the olive field. */
        --nav-surface: #FFFFFF;
        --nav-line: #E3E8D3;
        --nav-field: #F4F6EA;
        --nav-band: #16170F;
        --nav-band-ink: #8F9180;
        --tick-up: #9BE04A;
        --tick-down: #FF7A6B;

        /* Footer band. Ink in BOTH themes, so like the nav band it carries its
           own colours instead of the page tokens — on the olive field it is the
           third ink surface, after the ticker band and the holdings card. */
        --foot-surface: #14150F;
        --foot-ink: #F4F2EC;
        --foot-sub: #A9AB9C;
        --foot-soft: #8A8C7D;
        --foot-line: rgba(244, 242, 236, .11);
        --foot-accent: #D8F34A;

        /* Shimmer across the total-holdings figure: lime → white → lime. */
        --shimmer: linear-gradient(100deg, #D8F34A 30%, #FFFFFF 50%, #D8F34A 70%);
        --page-glow: none;

        /* Hero card carries its own surface so it can stay cream on the ink
           field (spec 02B) without dragging the other cards with it. */
        --hero-surface: #FFFFFF;
        --hero-line: #E3E8D3;
        --hero-ink: #16170F;
        --hero-sub: #6F6D5F;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #16170F;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        /* Crown Ridge logo — its own palette, kept separate from --accent on
           purpose. The mark is the brand; lime stays the UI accent. On a light
           ground the tile is solid dark and needs no edge. */
        --logo-tile: #16181B;
        --logo-stroke: transparent;
        --logo-crown: #F7F6F2;
        --logo-gold: #C9A227;
      }

      :root[data-theme="dark"] {
        /* — canonical Lime tokens — INK FIELD */
        --bg: #14150F;
        --surface: #1D1F14;
        --line: #2C2E20;
        --track: #2C2E20;

        --ink: #F4F2EC;
        --sub: #95978A;
        /* Same fix as the light theme, lightened instead of darkened. #6E7060 scored
           3.04:1 on --row-hover. Hue (67deg) and saturation (8%) unchanged.
           Now 5.02:1 on --row-hover, 5.44 on --surface, 5.99 on --bg. */
        --soft: #929583;

        --accent: #D8F34A;
        --accent-text: #D8F34A;

        /* Total-holdings card flips to a solid lime fill with ink numerals. */
        --feature: #D8F34A;
        --feature-ink: #14150F;
        --feature-sub: #5A6B12;
        --feature-num: #14150F;

        --row-hover: #23261A;
        --card-hover-border: #D8F34A;

        /* Nav shell — the floating card stays cream so nav + band read as one
           card in both themes; only the surfaces flip. */
        --nav-surface: #FFFDF7;
        --nav-line: #E3E8D3;
        --nav-field: #F2EFE4;
        --nav-band: #D8F34A;
        --nav-band-ink: #2C3505;
        --tick-up: #15490A;
        --tick-down: #8E1104;

        /* Footer band — a shade under the page (#14150F) so it still reads as a
           band of its own rather than dissolving into the field. */
        --foot-surface: #0E0F09;
        --foot-ink: #F4F2EC;
        --foot-sub: #A9AB9C;
        --foot-soft: #8A8C7D;
        --foot-line: rgba(244, 242, 236, .11);
        --foot-accent: #D8F34A;

        /* Shimmer across the total-holdings figure: ink → white → ink. */
        --shimmer: linear-gradient(100deg, #14150F 30%, #FFFFFF 50%, #14150F 70%);
        --page-glow: radial-gradient(90% 60% at 85% -10%, rgba(216,243,74,.13), transparent 60%);

        --hero-surface: #FFFDF7;
        --hero-line: #FFFDF7;
        --hero-ink: #16170F;
        --hero-sub: #6F6D5F;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #14150F;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        /* On the onyx ground the tile would disappear, so it darkens slightly
           and takes a hairline edge — this is logo/crown-ridge-dark.svg. */
        --logo-tile: #0F1113;
        --logo-stroke: #2B2F33;
        --logo-crown: #F7F6F2;
        --logo-gold: #C9A227;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
        line-height: 1.5;
        transition: background .25s, color .25s;
      }
      /* One soft lime glow over the ink field; `none` on the olive wash. */
      body::before {
        content: '';
        position: fixed; inset: 0; z-index: 0;
        background: var(--page-glow);
        pointer-events: none;
      }
      #app { position: relative; z-index: 1; }

      .display { font-family: var(--font-display); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      .display-italic { font-style: italic; }
      .eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--soft); font-weight: 500; }
      .mono { font-family: var(--font-mono); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      svg { display: block; }

      /* ============================================================
         ANIMATION SET (spec §06) — seven motions, nothing else.
         Reduced-motion overrides live in the media query further down.
         ============================================================ */

      /* 1 · Ticker marquee — content is duplicated once, so −50% loops seamlessly. */
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .tick-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }
      .tick-band:hover .tick-track { animation-play-state: paused; }

      /* 2 · Total-holdings shimmer — gradient clipped to the numerals. */
      @keyframes sweep { 0% { background-position: -140% 0; } 60%, 100% { background-position: 240% 0; } }
      .shimmer {
        background-image: var(--shimmer);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: sweep 5s 1s infinite;
      }

      /* 4 · Nav condense on scroll — --nav-h is set from topbar.jsx (68 → 56).
         Below 900px the bar wraps to two rows, so it sizes to its content. */
      .nav-shell {
        height: var(--nav-h);
        transition: height .32s cubic-bezier(.2,.7,.3,1), border-radius .32s cubic-bezier(.2,.7,.3,1);
        /* The marquee leaves .tick-track a permanent stacking context, and the
           band is a later sibling — without this the scrolling tickers paint
           over the search dropdown that hangs down from the bar. */
        position: relative;
        z-index: 1;
      }
      .tick-band { transition: height .32s cubic-bezier(.2,.7,.3,1), opacity .2s linear; }

      /* 5 · Card entry — once on mount, staggered 60ms per card via --i. */
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }
      .enter {
        animation: cardIn 600ms cubic-bezier(.2,.7,.3,1) both;
        animation-delay: calc(var(--i, 0) * 60ms);
      }

      /* 6 · Card hover — lift plus a soft shadow; no shadow at rest. */
      .lift { transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease, border-color .25s ease; }
      .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 34px -22px rgba(22,23,15,.55); }

      /* 7 · Live dot. */
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: .35; transform: scale(.7); }
      }
      .live-dot {
        width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        background: var(--accent);
        animation: pulseDot 1.8s infinite;
      }

      @keyframes pipeShimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(400%);  }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Visually hidden but exposed to screen readers. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      /* Skip link — first tab stop, becomes visible on focus. */
      .skip-link {
        position: absolute; left: 8px; top: -60px; z-index: 200;
        padding: 10px 16px; border-radius: 8px;
        background: var(--accent); color: #1B1A17;
        font-family: var(--font-mono); font-size: 13px; text-decoration: none;
        transition: top .15s ease;
      }
      .skip-link:focus { top: 8px; }

      /* Always show a focus ring for keyboard users. */
      :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

      /* WCAG 2.2 — respect the OS "reduce motion" setting.
         Marquee, shimmer and card entry stop outright; hover and the nav
         condense drop to 0ms (spec §06). */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
          scroll-behavior: auto !important;
        }
        /* The shimmer clips its colour to a moving gradient, so with the
           animation stopped the numerals need a solid fill to stay legible. */
        .shimmer {
          background-image: none;
          -webkit-text-fill-color: currentColor;
          color: var(--feature-num);
        }
        .lift:hover { transform: none; box-shadow: none; }
      }

      /* ============================================================
         RESPONSIVE LAYOUT
         Components style themselves with inline style={{}} objects,
         which cannot express media queries. So every grid whose COLUMN
         COUNT changes with viewport lives here as a class instead.
         Breakpoints: 900px (tablet) · 640px (phone).
         Anything that does not change with viewport stays inline.
         ============================================================ */

      /* Hero bento — summary.jsx. Hero row is hero card + total holdings
         (spec §05 "1fr 380px", held as 2:1 so it scales with the page),
         then a 3-up stat row underneath. */
      .r-bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(118px, auto); gap: 16px; }
      .r-bento-lead { grid-column: span 2; }
      .r-bento-feature { grid-column: span 1; }

      /* Two-pane split — top holdings beside the sector treemap */
      .r-split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }

      /* Metric groups — summary.jsx + detail.jsx */
      .r-metrics3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .r-kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; }
      /* Added / removed columns — changes.jsx */
      .r-changes2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

      /* Filter strip, top bar, detail price block, loading skeleton */
      /* Ledger header: title on the left, its three triggers on the right. They are
         compact enough to share the title's row, so they cost no vertical space of
         their own; on a phone they wrap underneath. */
      .r-ledger-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
      .r-ledger-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      /* Columns panel, anchored to stay inside the ledger card's overflow:hidden.
         Trigger is at the card's right edge here; see the phone override below. */
      .r-colpop { right: 0; }

      /* The filter panel, hung off its trigger the way .r-nav-menu is hung off the
         hamburger. Invisible full-screen catcher underneath it for outside clicks;
         the panel itself is absolute, so it tracks the button as the page scrolls. */
      .r-sheet-back {
        position: fixed; inset: 0; z-index: 30;
        background: transparent;
      }
      .r-sheet {
        position: absolute; top: 100%; right: 0; margin-top: 8px; z-index: 40;
        width: 300px; max-height: min(70vh, 560px);
        display: flex; flex-direction: column;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 16px; padding: 6px 16px 16px;
        box-shadow: 0 24px 48px -24px rgba(0,0,0,.45);
        animation: rise .12s ease-out;
      }
      /* A grab handle means "drag me from the edge" — true of the sheet, not this. */
      .r-sheet-grip {
        display: none;
        width: 38px; height: 4px; border-radius: 999px;
        background: var(--line); margin: 2px auto 14px;
      }
      /* Sections expand inline, so this is the only scroller in the panel. */
      .r-sheet-body { overflow-y: auto; flex: 1; min-height: 0; }
      .r-sheet-sec { border-bottom: 1px solid var(--line); }
      .r-sheet-sec-head {
        display: flex; align-items: center; gap: 10px;
        width: 100%; padding: 15px 2px;
        background: none; border: none; cursor: pointer; color: var(--ink);
        font-family: var(--font-mono); font-size: 11.5px; font-weight: 500;
        letter-spacing: .04em; text-transform: uppercase;
      }
      .r-sheet-sec-body { padding: 0 0 10px; }
      .r-sheet-reset {
        width: 100%; margin-top: 14px; padding: 11px;
        background: none; border: 1px dashed var(--line); border-radius: 10px;
        color: var(--soft); cursor: pointer;
        font-family: var(--font-mono); font-size: 11px;
        letter-spacing: .06em; text-transform: uppercase;
      }
      .r-sheet-done {
        margin-top: 14px; padding: 13px;
        background: var(--accent); color: var(--treemap-cell-fg);
        border: none; border-radius: 12px; cursor: pointer;
        font-family: var(--font-mono); font-size: 12px; font-weight: 600;
        letter-spacing: .04em; text-transform: uppercase;
      }
      @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .r-topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
      /* Nav actions cluster — the menu button at every width, and on phones a search
         toggle beside it. The toggle is hidden here because the search field itself
         is in the bar until the phone layout; !important because NavIconBtn sets
         display inline (same debt as the table cells below). */
      .r-nav-actions { display: flex; align-items: center; gap: 8px; }
      .r-nav-search-toggle { display: none !important; }
      /* Menu panel hugs the button it opened from. Left-anchored full-bleed only on
         phones, where the bar is narrow enough that a fixed 260px would look arbitrary. */
      .r-nav-menu { right: 0; width: 260px; }
      .r-priceblock { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: flex-end; }
      .r-skel4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

      /* Data table. Column templates are computed in JS because the visible
         columns are user-configurable, then handed to CSS as custom properties
         so the BREAKPOINT still lives here rather than in a JS media listener.
         --cols = fixed px (desktop) · --cols-m = minmax()/fr (phone). */
      .r-trow { display: grid; grid-template-columns: var(--cols); }
      .r-twrap { min-width: var(--tmin); position: relative; }
      .r-tscroll { height: 640px; overflow: auto; position: relative; }

      /* Compare modal — label column stays put while companies scroll. */
      .r-cmp-row { display: grid; grid-template-columns: 180px repeat(var(--cmp-n), minmax(180px, 1fr)); }
      .r-cmp-label { position: sticky; left: 0; z-index: 2; background: var(--bg); }

      /* Footer — statement, then three link columns, on even quarters so the
         rules behind them have something to trace. */
      .r-foot-cols {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 40px clamp(24px, 3vw, 48px);
        padding: clamp(56px, 7vw, 104px) 0 clamp(48px, 6vw, 88px);
      }
      /* Hairlines on the quarters. One element with a repeating gradient rather
         than four divs — they are decoration, not structure. */
      .r-foot-rules {
        position: absolute; inset: 0; pointer-events: none;
        background-image: repeating-linear-gradient(to right, var(--foot-line) 0 1px, transparent 1px 25%);
      }
      .r-foot-bar {
        display: flex; justify-content: space-between; align-items: flex-end; gap: 28px;
        border-top: 1px solid var(--foot-line);
        /* The bottom pad is the chat launcher's parking space (54px + a 24px
           inset): without it the launcher covers the sign-in link. */
        padding: clamp(30px, 3.5vw, 46px) 0 clamp(76px, 7vw, 96px);
      }
      .r-foot-lockup { display: flex; align-items: center; gap: clamp(12px, 1.4vw, 20px); min-width: 0; }
      /* BrandMark takes a px size prop; scaling it with the wordmark has to
         happen here, where the viewport is legible. */
      .r-foot-lockup svg { width: clamp(34px, 4.4vw, 56px); height: auto; }
      .r-foot-meta { font-size: 10.5px; line-height: 1.7; text-align: right; flex-shrink: 0; color: var(--foot-sub); }
      .r-flink { transition: color .15s ease; }
      .r-flink:hover { color: var(--foot-ink); }

      @media (max-width: 900px) {
        .r-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .r-bento-lead { grid-column: span 2; }
        .r-bento-feature { grid-column: span 2; }
        .r-split { grid-template-columns: minmax(0, 1fr); }
        .r-skel4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        /* Brand and actions share row 1; search gets its own full-width row.
           The brand column is 1fr rather than auto so it can shrink below its
           content instead of pushing the whole bar past the viewport. */
        .r-topbar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand actions" "search search"; row-gap: 12px; }
        .r-brand { grid-area: brand; min-width: 0; }
        .r-brand > div { min-width: 0; overflow: hidden; }
        .r-search { grid-area: search; min-width: 0; }
        .r-nav-actions { grid-area: actions; }
        /* Two rows will not fit the condensed height, so the shell sizes to
           its content and supplies the vertical padding itself. */
        .nav-shell { height: auto !important; padding: 12px 0; }
        /* Three link columns still fit; the statement takes its own row rather
           than being squeezed into a quarter. The rules go with the quarters
           they were tracing. */
        .r-foot-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .r-foot-cols > *:first-child { grid-column: 1 / -1; }
        .r-foot-rules { display: none; }
      }

      @media (max-width: 640px) {
        /* The four stat cards pair off instead of taking a row each. One per row
           cost ~560px of scrolling to read four short numbers; two-up halves that.
           Only the hero headline keeps the full width — it is a paragraph, not a
           figure. grid-auto-rows drops from 118px because the cards no longer need
           to hold a 38px numeral. */
        .r-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; grid-auto-rows: minmax(86px, auto); }
        .r-bento-lead { grid-column: span 2; }
        .r-bento-feature { grid-column: span 1; padding: 16px !important; }
        /* Type scaled to a ~165px-wide card. These are inline styles, so overriding
           needs !important — same debt as the table cells below. Values wrap rather
           than ellipsise: "NVIDIA Corp" truncated to "NVIDIA C…" reads as broken. */
        .r-bento-feature .display { font-size: 26px !important; }
        .r-bento > .card { padding: 16px 14px !important; }
        .r-bento > .card .display { font-size: 22px !important; white-space: normal !important; }
        .r-metrics3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .r-kv2 { grid-template-columns: minmax(0, 1fr); }
        .r-changes2 { grid-template-columns: minmax(0, 1fr); gap: 22px; }

        /* Ownership distribution — 370px of phone for one histogram. The header was
           91px of it: "Ownership distribution" and "1,422 cos" each wrapped to two
           lines fighting over 343px. Dropping the eyebrow and the count leaves the
           title alone on one line at full size, and the count is already on the
           hero card. The only svg in here is the histogram. */
        .r-owncard { padding: 16px !important; }
        .r-owncard > div:first-child .eyebrow { display: none; }
        .r-owncard svg { height: 92px !important; }
        /* Three triggers in 305px of room: 318px at desktop padding, so they wrap to
           a second row. !important because pillStyle() sets padding inline. */
        .r-ledger-tools { gap: 6px; }
        .r-ledger-tools button { padding: 7px 9px !important; }
        /* "HOLDINGS LEDGER" over a title that already reads "All positions · N rows"
           is a label for something the next line names. Desktop keeps it. */
        .r-ledger-eyebrow { display: none; }

        /* The header wraps here, putting the trigger near the card's LEFT edge —
           right-anchoring would hang 105px of the panel off the clipped side. */
        .r-colpop { right: auto; left: 0; }

        /* Same panel, re-seated as a bottom sheet: fixed to the bottom edge rather
           than hung off the button, full width, thumb-reachable, with the grab
           handle that implies it. The catcher becomes a dimming scrim. */
        .r-sheet-back { background: rgba(0,0,0,.5); z-index: 200; animation: fade .16s ease-out; }
        .r-sheet {
          position: fixed; inset: auto 0 0 0; z-index: 201;
          width: 100%; max-height: 85vh; margin-top: 0;
          border: none; border-radius: 20px 20px 0 0;
          padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
          animation: sheet-up .2s cubic-bezier(.2,.8,.2,1);
        }
        .r-sheet-grip { display: block; }
        .r-priceblock { grid-template-columns: minmax(0, 1fr); gap: 18px; }
        .r-skel4 { grid-template-columns: minmax(0, 1fr); }

        /* Table fits the viewport instead of scrolling sideways. */
        .r-trow { grid-template-columns: var(--cols-m, var(--cols)); }
        .r-twrap { min-width: 0; }
        .r-tscroll { height: 68vh; }
        /* These cells are styled inline, so overriding them needs !important.
           Remove once the inline styles move into classes (see audit Q5). */
        .r-trow > * { padding-left: 9px !important; padding-right: 9px !important; }
        .r-thead > * { font-size: 9px !important; letter-spacing: .03em !important; }

        .r-cmp-row { grid-template-columns: 108px repeat(var(--cmp-n), minmax(136px, 1fr)); }

        /* Nav collapses to ONE line: brand, then a search toggle and the menu button.
           Two rows plus the ticker band was costing 161px — a fifth of a phone
           screen — and scrolling barely helped, because the two-row grid forces
           .nav-shell to height:auto and the condensed 56px height never applied.
           The menu already holds Period / What changed / Theme at every width; what
           is phone-specific is that the search FIELD gives up its place in the bar
           and reappears as a second row only while its toggle is on. */
        .r-topbar { grid-template-areas: "brand actions"; gap: 10px; }
        .r-nav-search-toggle { display: inline-flex !important; }
        .r-search { display: none; }
        .r-topbar.search-open { grid-template-areas: "brand actions" "search search"; }
        .r-topbar.search-open .r-search { display: block; }
        .r-nav-menu { left: 0; width: auto; }
        /* The eyebrow is the brand block's second line — dropping it is what makes
           the bar single-line. Its only content here is "Norway GPFG"; the date and
           "Equity Holdings" are already hidden at this width by .r-hide-sm. */
        .r-brand .eyebrow { display: none !important; }
        .nav-shell { padding: 10px 0 !important; }

        /* Three link columns in 340px leaves "Browse by sector" wrapping to
           three lines; two columns keep every label on one. */
        .r-foot-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 24px; }
        /* The lockup owns the width at this size, so the meta stacks under it
           and reads from the same left edge as everything else. */
        .r-foot-bar { flex-direction: column; align-items: flex-start; gap: 24px; }
        .r-foot-meta { text-align: left; }

        /* Utility: drop non-essential chrome on the smallest screens. */
        .r-hide-sm { display: none !important; }
      }
    </style>

      /* ============================================================
         DUSK, Hallmark's money-software theme, mapped onto this app's own
         token names (--bg, --ink, --accent ...) so every inline style that
         already reads a token follows without being touched.
         Dark is Dusk itself: slate, smoked-glass panels with a lit top edge,
         and the logo's own pair for a signal: ivory fills, gold text. Light is
         Dusk's day side: bone wells, card white, slate ink, where the fills
         turn to the logo tile's slate and the gold deepens. Hue never moves.
         STYLE_GUIDE.md still describes the Lime system this replaced.
         ============================================================ */

      /* GEOMETRY and SCALE: theme-independent, so on bare :root. */
      :root {
        --r-xs: 4px;
        --r-sm: 8px;
        --r-md: 10px;
        --r-lg: 16px;
        --r-xl: 18px;
        --r-pill: 999px;

        --page-max: 1520px;
        --gutter: clamp(16px, 2vw, 24px);

        --gap: 16px;
        --gap-tight: 12px;

        --pad-card: 24px;
        --pad-card-lg: 40px;

        /* App controls stand 32 to 40px. */
        --control-h: 34px;
        --control-h-lg: 40px;

        --scrim: oklch(10% 0.022 268 / 0.55);
        --scrim-blur: blur(3px);

        --accent-tint: color-mix(in srgb, var(--accent) 14%, transparent);
        --accent-tint-soft: color-mix(in srgb, var(--accent) 6%, transparent);
        --accent-edge: color-mix(in srgb, var(--accent) 45%, transparent);
        --accent-ring: color-mix(in srgb, var(--accent) 60%, transparent);
        /* The light that runs along a progress bar while a job works. */
        --sheen: oklch(100% 0 0 / 0.35);

        --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px;
        --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;

        /* App type: a fixed 1.2 ratio from a 16px body, no fluid heads. */
        --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-md: 1rem; --text-lg: 1.2rem;
        --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.074rem; --text-figure: 2.75rem;

        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;

        --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200; --z-sticky-nav: 300;
        --z-modal: 400; --z-toast: 500; --z-tooltip: 600;

        /* The project's own faces, kept over Dusk's Wix Madefor at the owner's
           request: Space Grotesk for heads and text, JetBrains Mono for figures and
           tickers (.mono). */
        --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        --font-body: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --tracking-display: -0.022em;
        --display-weight: 500;

        /* The hour: type set on the photograph is light, over a shade drawn from
           Dusk's slate, in both modes, since the photograph is the same picture on
           either side. */
        --hero-ink: oklch(97% 0.006 75);
        --hero-sub: oklch(89% 0.012 75);
        --shade: oklch(14% 0.02 268);
        --glass-blur: 22px;
        /* Dusk's second signal: open, waiting, offline. Neutral at the owner's
           request, so the logo's gold is the only warm colour and the words carry
           the state. Never a large fill; red stays with losses. */
        --signal-2: oklch(72% 0.016 262);

        /* Sector hues: one quiet family at Dusk's chroma, each kept clear of gain
           green (150) and loss red (27). The accent fills are ivory, and its gold
           only ever sets text, so no tile can be read as it. Dark ink sits on
           every one of them. */
        --sector-tech: oklch(70% 0.08 245);
        --sector-financials: oklch(79% 0.075 100);
        --sector-healthcare: oklch(75% 0.07 185);
        --sector-energy: oklch(73% 0.085 55);
        --sector-industrials: oklch(70% 0.07 305);
        --sector-consumer: oklch(73% 0.075 355);
        --sector-utilities: oklch(83% 0.07 80);
        --sector-realestate: oklch(67% 0.045 130);
        --treemap-cell-fg: oklch(19% 0.035 274);

        /* Crown Ridge mark: the brand's own values, from logo/*.svg. */
        --logo-crown: #F7F6F2;
        --logo-gold: #C9A227;
      }

      /* DAY: Dusk's bone side. */
      :root[data-theme="light"] {
        color-scheme: light;

        --soft: oklch(45% 0.016 265);

        /* The logo's pair, turned for day: fills take the slate of the logo's tile,

        --accent: oklch(27% 0.018 268);

        transition: background-color var(--dur-short) var(--ease-in-out), color var(--dur-short) var(--ease-in-out);
      }
      #app { position: relative; z-index: var(--z-base); }
      ::selection { background: color-mix(in oklab, var(--accent) 30%, transparent); color: var(--ink); }

      h1, h2, h3, .display {
        font-family: var(--font-display); font-weight: var(--display-weight);
        letter-spacing: var(--tracking-display); overflow-wrap: break-word; min-width: 0;
        text-wrap: balance;
      }
      .display { font-size: var(--text-2xl); line-height: 1.1; }
      /* Labels, captions and meta: the body face a step smaller, sentence case. */
      .eyebrow { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 400; color: var(--soft); }
      .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
      /* A panel: smoked glass on slate, a card on bone. Border or edge light, never a drop shadow too. */
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--glass-hi); }

      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes pipeShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      svg { display: block; }

      /* Every control: a press and a disabled state, on top of hover and focus. */
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled, [aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }

      /* Ticker band: one loop, paused by hover, focus or its own control. */
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .tick-track { display: flex; width: max-content; animation: marquee 40s linear infinite; }
      .tick-band:hover .tick-track,
      .tick-band:focus-within .tick-track,
      .tick-band.is-paused .tick-track { animation-play-state: paused; }

      /* Nav condense: --nav-h is set from topbar.jsx (68 to 56). The height steps
         rather than animates; only opacity and transform ever move. */
      .nav-shell { height: var(--nav-h); position: relative; z-index: var(--z-base); }
      .tick-band { transition: opacity var(--dur-short) var(--ease-out); }

      /* A control that is a whole card: hover steps its edge, nothing lifts. */
      .lift { transition: border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out); }
      .lift:hover { border-color: var(--card-hover-border); background-color: var(--row-hover); }

      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      .skip-link {
        position: absolute; left: var(--space-xs); top: var(--space-xs); z-index: var(--z-toast);
        padding: var(--space-xs) var(--space-md); border-radius: var(--r-md);
        background: var(--accent); color: var(--accent-ink);
        font-size: var(--text-sm); font-weight: 500; text-decoration: none;
        transform: translateY(-200%);
      }
      .skip-link:focus { transform: none; }

      /* Focus rings appear at once and never transition. */
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      input:focus-visible, textarea:focus-visible { outline-offset: -2px; }
      /* A field whose input sits inside a styled wrapper rings the whole field. */
      .r-field:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
      .r-field input:focus-visible, .r-field textarea:focus-visible { outline: none; }
      .r-thead [role="columnheader"]:focus-visible { outline-offset: -2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
          scroll-behavior: auto !important;
        }
        button:active:not(:disabled) { transform: none; }
      }

      /* ============================================================
         RESPONSIVE LAYOUT
         Components style themselves with inline style={{}} objects,
         which cannot express media queries. So every grid whose COLUMN
         COUNT changes with viewport lives here as a class instead.
         Breakpoints: 900px (tablet), 640px (phone).
         ============================================================ */

      /* THE HOUR: one photograph of land at dusk behind the head, fading into the
         ground. z-index -1 inside #app's own stacking context puts it under every
         section without repositioning any of them. */
      .r-hour {
        position: absolute; inset: 0 0 auto 0; height: min(calc(100svh + 140px), 1120px); min-height: 760px; overflow: hidden; z-index: -1;
        /* The photograph itself fades out, in eased steps, so the page shows through
           it: no colour is painted over the picture and no edge is left to see. */
        -webkit-mask-image: linear-gradient(to bottom, black 36%, color-mix(in srgb, black 82%, transparent) 50%, color-mix(in srgb, black 55%, transparent) 64%, color-mix(in srgb, black 27%, transparent) 78%, color-mix(in srgb, black 8%, transparent) 90%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 36%, color-mix(in srgb, black 82%, transparent) 50%, color-mix(in srgb, black 55%, transparent) 64%, color-mix(in srgb, black 27%, transparent) 78%, color-mix(in srgb, black 8%, transparent) 90%, transparent 100%);
      }
      /* In light mode the photograph fades to a pale page, which would wash out the
         light type set on it, so it holds solid until the head's copy has ended. */
      :root[data-theme="light"] .r-hour {
        -webkit-mask-image: linear-gradient(to bottom, black 64%, color-mix(in srgb, black 82%, transparent) 74%, color-mix(in srgb, black 55%, transparent) 82%, color-mix(in srgb, black 27%, transparent) 89%, color-mix(in srgb, black 8%, transparent) 95%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 64%, color-mix(in srgb, black 82%, transparent) 74%, color-mix(in srgb, black 55%, transparent) 82%, color-mix(in srgb, black 27%, transparent) 89%, color-mix(in srgb, black 8%, transparent) 95%, transparent 100%);
      }
      /* The What-changed head is shorter than the dashboard's, so its photograph
         ends just under the tally rather than running on behind the charts. */
      .r-hour.is-banner { height: min(calc(100svh - 20px), 900px); min-height: 680px; }
      .r-hour img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; filter: contrast(1.04) saturate(1.03); }
      /* One soft pool of shade behind the head only, round and edgeless, so the rest
         of the picture keeps its own light. */
      .r-hour::after {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(ellipse 40% 34% at 19% 42%, color-mix(in oklab, var(--shade) 46%, transparent) 0%, color-mix(in oklab, var(--shade) 26%, transparent) 50%, transparent 100%);
      }
      /* Type set on the photograph: light, lifted off the picture by a soft shadow
         in the shade's colour rather than by a box. */
      .on-photo { color: var(--hero-ink); text-shadow: 0 1px 2px color-mix(in oklab, var(--shade) 55%, transparent), 0 0 24px color-mix(in oklab, var(--shade) 45%, transparent); }

      /* Stage hero: the head on five tracks, the product in glass on six. */
      .r-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-2xl); align-items: center; padding: var(--space-2xl) 0 var(--space-xl); }
      .r-hero h1, .r-banner h1 { font-size: 3.25rem; line-height: 1.04; max-width: 17ch; margin: 0; }
      .r-hero-lede { font-size: var(--text-lg); line-height: 1.5; max-width: 40ch; margin: var(--space-md) 0 0; color: var(--hero-sub); }
      .r-hero-actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xl); }
      /* Banner hero: the What-changed page, head and its controls, no product. */
      .r-banner { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-lg); justify-items: start; padding: var(--space-2xl) 0 var(--space-lg); }

      /* Smoked glass with a lit top edge on slate; a frosted card on bone. Never
         nested, never without its edge. */
      .glass {
        background: var(--glass); color: var(--ink); box-sizing: border-box;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        border-radius: var(--r-xl); box-shadow: var(--glass-hi), var(--shadow-card);
      }

      /* A run of accounts: a logo, the name, the balance at the right. */
      .r-acct { list-style: none; margin: 0; padding: 0; }
      .r-acct > li + li { border-top: 1px solid var(--glass-rule); }
      .r-acct-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm); width: 100%; padding: var(--space-sm) 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      /* Each row's value against the largest holding: a slim bar on a faint track,
         always shown. It grows in once, just after its row rises (motion set below),
         and brightens while the row is pointed at or focused. */
      .r-acct-bar { display: block; height: 3px; margin-top: var(--space-2xs); border-radius: var(--r-pill); overflow: hidden; background: color-mix(in oklab, var(--ink) 8%, transparent); }
      .r-acct-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); opacity: 0.7; transform: scaleX(var(--w, 0)); transform-origin: left; transition: opacity var(--dur-micro) var(--ease-out); }
      .r-acct-row:hover .r-acct-bar > span, .r-acct-row:focus-visible .r-acct-bar > span { opacity: 1; }

      /* Open sections on the ground: a ruled head, then the content. No card. */
      .r-sec { padding-top: var(--space-3xl); }
      .r-sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-sm) var(--space-lg); padding-bottom: var(--space-md); margin-bottom: var(--space-lg); border-bottom: 1px solid var(--line); }
      .r-sec-head h2 { font-size: var(--text-2xl); line-height: 1.1; margin: 0; }
      .r-sec-head p { margin: var(--space-2xs) 0 0; font-size: var(--text-sm); color: var(--soft); }
      /* A list beside one pane, and a pair of equal columns. */
      .r-duo { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--space-2xl); align-items: start; }
      .r-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2xl); align-items: start; }

      /* A ruled list of rows that each filter something. */
      .r-rows { list-style: none; margin: 0; padding: 0; }
      .r-rows > li { border-bottom: 1px solid var(--line); }
      .r-row-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: var(--space-xs) var(--space-md); width: 100%; padding: var(--space-sm) 0; background: none; border: 0; font: inherit; color: var(--sub); text-align: left; cursor: pointer; transition: color var(--dur-micro) var(--ease-out); }
      .r-row-btn:hover, .r-row-btn[aria-pressed="true"] { color: var(--ink); }
      .r-row-btn[aria-pressed="true"] .r-row-name { color: var(--accent-text); font-weight: 600; }
      .r-row-btn.is-hot { color: var(--ink); }
      .r-row-btn.is-hot .r-row-bar { background: color-mix(in oklab, var(--ink) 16%, transparent); }
      .r-row-bar { grid-column: 1 / -1; height: 3px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
      .r-row-bar > span { display: block; height: 100%; background: var(--accent); transform-origin: left; }

      /* Opened against closed: one row per sector or market. */
      .r-div-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1.6fr) 40px; align-items: center; gap: var(--space-xs); }

      /* A tab row scrolls sideways rather than wrapping. */
      .r-tabs { display: flex; gap: 0 var(--space-md); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
      .r-tabs::-webkit-scrollbar { display: none; }

      /* The page container: one width for everything that is not a full band. */
      .r-page {
        box-sizing: border-box; width: 100%; max-width: calc(var(--page-max) + 2 * var(--gutter));
        margin-inline: auto; padding-inline: var(--gutter);
        display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap);
      }

      /* A closing band: a second photograph runs edge to edge under the end of the
         ledger, the way Dusk closes a page. Its calm sky sits behind the last rows,
         its land shows clear below the table, and it fades in at the top and out at
         the foot, never at the sides, so it reads as a landscape rather than a patch.
         --band-img and --band-pos are set where it is used. */
      .r-band { position: relative; isolation: isolate; padding-bottom: 380px; }
      .r-band::before {
        content: ""; position: absolute; z-index: -1; inset: auto 0 0; height: 820px;
        background:
          linear-gradient(color-mix(in oklab, var(--bg) 18%, transparent), color-mix(in oklab, var(--bg) 18%, transparent)),
          var(--band-img) var(--band-pos, 50% 50%) / cover no-repeat;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, black 35%, transparent) 18%, color-mix(in srgb, black 85%, transparent) 38%, black 50%, black 64%, color-mix(in srgb, black 72%, transparent) 76%, color-mix(in srgb, black 38%, transparent) 87%, color-mix(in srgb, black 12%, transparent) 95%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, black 35%, transparent) 18%, color-mix(in srgb, black 85%, transparent) 38%, black 50%, black 64%, color-mix(in srgb, black 72%, transparent) 76%, color-mix(in srgb, black 38%, transparent) 87%, color-mix(in srgb, black 12%, transparent) 95%, transparent 100%);
      }

      /* Night by night: Dusk's strip of slim bars in one glass panel. Each bar is a
         pill, lit at its top and fading toward its foot; a band with no companies is a
         short hatched stub. */
      .r-nights { padding: var(--space-lg) var(--space-lg) var(--space-md); }
      .r-nights-bars, .r-nights-axis { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--space-2xs); }
      .r-nights-bars { align-items: end; }
      .r-night { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 100%; padding: 0; background: none; border: 0; cursor: pointer; }
      .r-night-bar {
        width: min(14px, 62%); height: max(10px, calc(var(--h, 0) * 100%)); border-radius: var(--r-pill);
        background: linear-gradient(to bottom, var(--accent), color-mix(in oklab, var(--accent) 26%, transparent));
        opacity: 0.88; transform-origin: 50% 100%;
        transition: transform 800ms var(--ease-out) calc(var(--i, 0) * 25ms), opacity var(--dur-micro) var(--ease-out);
      }
      .r-night:hover .r-night-bar, .r-night:focus-visible .r-night-bar { opacity: 1; }
      .r-night.is-empty .r-night-bar { height: 10px; background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--line); }
      .r-nights.has-sel .r-night:not(.is-on) .r-night-bar { opacity: 0.3; }
      .r-nights-axis { margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--soft); text-align: center; font-variant-numeric: tabular-nums; }

      /* MOTION. Dusk's own, each piece once: the hour drifts, the accounts rise in,
         the tally counts up (summary.jsx), and charts grow when first seen. Only
         transform and opacity move; with reduced motion nothing does. */
      @keyframes hour-drift { from { transform: scale(1.06) translateX(1.5%); } to { transform: scale(1.06) translateX(-1.5%); } }
      @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes bar-grow { from { transform: scaleX(0); } }
      .r-row-bar > span { transition: transform 900ms var(--ease-out) calc(var(--i, 0) * 40ms); }
      .r-div-fill { transition: transform 800ms var(--ease-out) calc(var(--i, 0) * 35ms); }
      .r-tile { transition: transform 600ms var(--ease-out) calc(var(--i, 0) * 40ms); }
      @media (prefers-reduced-motion: no-preference) {
        .r-hour img { animation: hour-drift 48s var(--ease-in-out) both; }
        .r-acct > li { animation: rise-in 520ms var(--ease-out) both; animation-delay: calc(120ms + var(--i, 0) * 45ms); }
        .r-acct-bar > span { animation: bar-grow 1000ms var(--ease-out) both; animation-delay: calc(480ms + var(--i, 0) * 60ms); }
        [data-seen="false"] .r-row-bar > span { transform: scaleX(0) !important; }
        [data-seen="false"] .r-night-bar { transform: scaleY(0); }
        [data-seen="false"] .r-div-fill { transform: scaleX(0); }
        [data-seen="false"] .r-tile { transform: scale(0.9); }
      }

      /* The ruled tally: figures in a row, parted by hairlines, no tile per figure.
         The first cell keeps no leading pad and the last no trailing one. */
      .r-tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .r-tally > * { padding: var(--space-md) var(--space-lg); border-left: 1px solid var(--line); min-width: 0; }
      .r-tally > :first-child { padding-left: 0; border-left: 0; }
      .r-tally > :last-child { padding-right: 0; }
      .r-tally-fig { font-family: var(--font-display); font-weight: 500; font-size: var(--text-2xl); letter-spacing: var(--tracking-display); line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: var(--space-2xs); overflow-wrap: break-word; }
      .r-tally-fig.is-lead { font-size: var(--text-figure); }
      .r-tally-sub { font-size: var(--text-sm); color: var(--soft); margin-top: var(--space-2xs); font-variant-numeric: tabular-nums; }
      .r-tally.glass { border: 0; padding: var(--space-md) var(--space-xl); }
      .r-tally.glass > * { border-color: var(--glass-rule); }

      /* Metric groups: detail.jsx */
      .r-metrics3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
      .r-kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; }
      .r-research3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xs); }
      /* What-changed page: changes.jsx */
      .r-chg-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
      .r-chg-search { width: min(260px, 100%); }
      /* Change ledger rows: rank, company, country, sector, side, value, arrow.
         A grid rather than a table so the cells can be hidden per breakpoint below. */
      .r-chg-row { display: grid; grid-template-columns: 44px minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.2fr) 112px 168px 34px; align-items: center; }
      /* Same viewport as the ledger's .r-tscroll, but a max: a filtered list of five rows should not sit in 640px of empty card. */
      .r-chg-scroll { max-height: 640px; overflow: auto; position: relative; }
      .r-chg-sub { display: none; font-size: var(--text-xs); color: var(--soft); margin-top: var(--space-3xs); }

      /* Ledger header: title on the left, its three triggers on the right. */
      .r-ledger-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: var(--space-sm); }
      .r-ledger-tools { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-xs); }
      .r-colpop { right: 0; }

      /* The filter panel, hung off its trigger. */
      .r-sheet-back { position: fixed; inset: 0; z-index: 30; background: transparent; }
      .r-sheet {
        position: absolute; top: 100%; right: 0; margin-top: var(--space-xs); z-index: 40;
        width: 300px; max-height: min(70vh, 560px);
        display: flex; flex-direction: column;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--r-lg); padding: var(--space-2xs) var(--space-md) var(--space-md);
        box-shadow: var(--glass-hi);
        animation: rise var(--dur-micro) var(--ease-out);
      }
      .r-sheet-grip { display: none; width: 40px; height: 4px; border-radius: var(--r-pill); background: var(--line); margin: var(--space-3xs) auto var(--space-sm); }
      .r-sheet-body { overflow-y: auto; flex: 1; min-height: 0; }
      .r-sheet-sec { border-bottom: 1px solid var(--line); }
      .r-sheet-sec-head {
        display: flex; align-items: center; gap: var(--space-xs);
        width: 100%; padding: var(--space-md) var(--space-3xs);
        background: none; border: none; cursor: pointer; color: var(--ink);
        font-family: var(--font-body); font-size: var(--text-sm); font-weight: 500;
      }
      .r-sheet-sec-body { padding: 0 0 var(--space-xs); }
      .r-sheet-reset, .r-sheet-done {
        width: 100%; margin-top: var(--space-sm);
        height: var(--control-h-lg); padding: 0 var(--space-md);
        border-radius: var(--r-pill); cursor: pointer;
        font-family: var(--font-body); font-size: var(--text-sm);
        transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
      }
      .r-sheet-reset { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
      .r-sheet-reset:hover { background: var(--row-hover); border-color: var(--card-hover-border); }
      .r-sheet-done { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); font-weight: 600; }
      .r-topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--gap); }
      .r-nav-actions { display: flex; align-items: center; gap: var(--space-xs); }
      .r-nav-search-toggle { display: none !important; }
      .r-nav-menu { right: 0; width: 260px; }

      /* Data table. Column templates are computed in JS because the visible
         columns are user-configurable, then handed to CSS as custom properties
         so the BREAKPOINT still lives here rather than in a JS media listener.
         --cols = fixed px (desktop), --cols-m = minmax()/fr (phone). */
      .r-trow { display: grid; grid-template-columns: var(--cols); }
      .r-twrap { min-width: var(--tmin); position: relative; }
      .r-tscroll { height: 640px; overflow: auto; position: relative; }

      /* Compare modal: label column stays put while companies scroll. */
      .r-cmp-row { display: grid; grid-template-columns: 180px repeat(var(--cmp-n), minmax(180px, 1fr)); }
      .r-cmp-label { position: sticky; left: 0; z-index: 2; background: var(--bg); }

      /* Footer: statement, then three link columns, on slate in both modes. */
      .r-foot-cols {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        column-gap: var(--space-xl);
        row-gap: var(--space-xl);
        padding: var(--space-3xl) 0 var(--space-2xl);
      }
      .r-foot-bar {
        display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-lg);
        border-top: 1px solid var(--foot-line);
        /* The bottom pad is the chat launcher's parking space. */

      }
      .r-foot-lockup { display: flex; align-items: center; gap: var(--space-md); min-width: 0; }
      .r-foot-lockup svg { width: clamp(34px, 4.4vw, 56px); height: auto; }

      @media (max-width: 900px) {
        .r-hero, .r-duo, .r-pair { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
        .r-nights-axis span:not(:nth-child(2n+1)) { visibility: hidden; }
        .r-hero h1, .r-banner h1 { font-size: 2.5rem; }
        .r-tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .r-tally > * { padding: var(--space-md) var(--space-md); }
        .r-tally > :nth-child(odd) { padding-left: 0; border-left: 0; }
        .r-tally > :nth-child(n+3) { border-top: 1px solid var(--line); }
        /* Sector drops first: it is the widest text column, and the company cell
           can carry it as a second line once the column is gone. */
        .r-chg-row { grid-template-columns: 44px minmax(0, 2fr) minmax(0, 1fr) 112px 150px 34px; }

        .r-chg-sub { display: block; }
        .r-chg-sub-country { display: none; }

        .r-brand { grid-area: brand; min-width: 0; }

        .r-nav-actions { grid-area: actions; }

        .r-tally.glass { padding: var(--space-sm) var(--space-md); }

        .r-band { padding-bottom: 220px; }

        .r-metrics3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-tight); }

        /* Change ledger on a phone: company, side, value. Country and sector are

        .r-chg-row { grid-template-columns: minmax(0, 1fr) 92px 96px; }

        .r-chg-rank, .r-chg-country, .r-chg-sector, .r-chg-arrow { display: none !important; }

        .r-chg-row > * { padding-left: var(--space-xs) !important; padding-right: var(--space-xs) !important; }

        .r-ledger-tools { gap: var(--space-2xs); }

        .r-colpop { right: auto; left: 0; }

        /* Same panel, re-seated as a bottom sheet. */

        .r-sheet {

          width: 100%; max-height: 85vh; margin-top: 0;
          border: none; border-radius: var(--r-xl) var(--r-xl) 0 0;
          padding: var(--space-sm) var(--space-md) calc(var(--space-md) + env(safe-area-inset-bottom));
          animation: sheet-up var(--dur-short) var(--ease-out);
        }
        .r-sheet-grip { display: block; }
        .r-research3 { grid-template-columns: minmax(0, 1fr); }

        /* Table fits the viewport instead of scrolling sideways. */
        .r-trow { grid-template-columns: var(--cols-m, var(--cols)); }
        .r-twrap { min-width: 0; }
        .r-tscroll { height: 68vh; }
        .r-chg-scroll { max-height: 68vh; }
        /* These cells are styled inline, so overriding them needs !important. */
        .r-trow > * { padding-left: var(--space-xs) !important; padding-right: var(--space-xs) !important; }
        .r-thead > * { font-size: var(--text-xs) !important; }

        .r-cmp-row { grid-template-columns: 108px repeat(var(--cmp-n), minmax(136px, 1fr)); }

        /* Nav collapses to one line: brand, then a search toggle and the menu button. */
        .r-topbar { grid-template-areas: "brand actions"; gap: var(--space-xs); }
        .r-nav-search-toggle { display: inline-flex !important; }
        .r-search { display: none; }
        .r-topbar.search-open { grid-template-areas: "brand actions" "search search"; }
        .r-topbar.search-open .r-search { display: block; }
        .r-nav-menu { left: 0; width: auto; }
        .r-brand .eyebrow { display: none !important; }
        .nav-shell { padding: var(--space-xs) 0 !important; }

        .r-foot-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--space-xl); column-gap: var(--space-lg); }
        .r-foot-bar { flex-direction: column; align-items: flex-start; gap: var(--space-lg); }
        .r-foot-meta { text-align: left; }

        .r-hide-sm { display: none !important; }
      }

      @media (max-width: 400px) {

        .r-tally > :nth-child(n+2) { border-top: 1px solid var(--line); }
      }

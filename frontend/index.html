    <style>
      /* ============================================================
         "LIME" DESIGN SYSTEM — see STYLE_GUIDE.md (single source of truth)
         Light is default; [data-theme="dark"] inverts.
         Canonical tokens first, then back-compat aliases that map the
         app's legacy token names onto Lime values during migration.
         ============================================================ */
      :root[data-theme="light"] {
        /* — canonical Lime tokens — */
        --bg: #F4F3EE;
        --surface: #FFFFFF;
        --line: #E4E2DA;
        --track: #ECEAE2;

        --ink: #1B1A17;
        --sub: #7C786E;
        --soft: #9C988C;

        --accent: #D6E134;
        --accent-text: #8E9612;

        --feature: #1B1A17;
        --feature-ink: #FCFEE7;
        --feature-sub: #9A968A;
        --feature-num: #D6E134;

        --row-hover: #FAF9F5;
        --card-hover-border: #1B1A17;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #1B1A17;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      :root[data-theme="dark"] {
        /* — canonical Lime tokens — ONYX palette (pure neutral black) */
        --bg: #08080A;
        --surface: #131316;
        --line: #1C1C20;
        --track: #1C1C20;

        --ink: #F6F6F2;
        --sub: #A0A0A4;
        --soft: #74747A;

        --accent: #D6E134;
        --accent-text: #D6E134;

        --feature: #D6E134;
        --feature-ink: #08080A;
        --feature-sub: #5F6A12;
        --feature-num: #08080A;

        --row-hover: #1C1C20;
        --card-hover-border: #D6E134;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #08080A;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
        line-height: 1.5;
        transition: background .25s, color .25s;
      }

      .display { font-family: var(--font-display); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      .display-italic { font-style: italic; }
      .eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--soft); font-weight: 500; }
      .mono { font-family: var(--font-mono); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      svg { display: block; }

      @keyframes pipeShimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(400%);  }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Visually hidden but exposed to screen readers. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      /* Skip link — first tab stop, becomes visible on focus. */
      .skip-link {
        position: absolute; left: 8px; top: -60px; z-index: 200;
        padding: 10px 16px; border-radius: 8px;
        background: var(--accent); color: #1B1A17;
        font-family: var(--font-mono); font-size: 13px; text-decoration: none;
        transition: top .15s ease;
      }
      .skip-link:focus { top: 8px; }

      /* Always show a focus ring for keyboard users. */
      :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

      /* WCAG 2.2 — respect the OS "reduce motion" setting. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* ============================================================
         RESPONSIVE LAYOUT
         Components style themselves with inline style={{}} objects,
         which cannot express media queries. So every grid whose COLUMN
         COUNT changes with viewport lives here as a class instead.
         Breakpoints: 900px (tablet) · 640px (phone).
         Anything that does not change with viewport stays inline.
         ============================================================ */

      /* Hero bento — summary.jsx */
      .r-bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(118px, auto); gap: 14px; }
      .r-bento-lead { grid-column: span 3; grid-row: span 2; }
      .r-bento-feature { grid-row: span 3; }

      /* Two-pane split — top holdings beside the sector treemap */
      .r-split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }

      /* Metric groups — summary.jsx + detail.jsx */
      .r-metrics3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .r-kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; }

      /* Filter strip, top bar, detail price block, loading skeleton */
      .r-filterbar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
      .r-topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
      .r-priceblock { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: flex-end; }
      .r-skel4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

      /* Data table. Column templates are computed in JS because the visible
         columns are user-configurable, then handed to CSS as custom properties
         so the BREAKPOINT still lives here rather than in a JS media listener.
         --cols = fixed px (desktop) · --cols-m = minmax()/fr (phone). */
      .r-trow { display: grid; grid-template-columns: var(--cols); }
      .r-twrap { min-width: var(--tmin); position: relative; }
      .r-tscroll { height: 640px; overflow: auto; position: relative; }

      /* Compare modal — label column stays put while companies scroll. */
      .r-cmp-row { display: grid; grid-template-columns: 180px repeat(var(--cmp-n), minmax(180px, 1fr)); }
      .r-cmp-label { position: sticky; left: 0; z-index: 2; background: var(--bg); }

      @media (max-width: 900px) {
        .r-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .r-bento-lead { grid-column: span 2; grid-row: auto; }
        .r-bento-feature { grid-column: span 2; grid-row: auto; }
        .r-split { grid-template-columns: minmax(0, 1fr); }
        .r-skel4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        /* Brand and actions share row 1; search gets its own full-width row. */
        .r-topbar { grid-template-columns: auto auto; grid-template-areas: "brand actions" "search search"; row-gap: 12px; justify-content: space-between; }
        .r-brand { grid-area: brand; }
        .r-search { grid-area: search; max-width: none !important; }
        .r-actions { grid-area: actions; }
      }

      @media (max-width: 640px) {
        .r-bento { grid-template-columns: minmax(0, 1fr); }
        .r-bento-lead, .r-bento-feature { grid-column: span 1; }
        .r-metrics3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .r-kv2 { grid-template-columns: minmax(0, 1fr); }
        .r-filterbar { grid-template-columns: minmax(0, 1fr); gap: 10px; }
        .r-priceblock { grid-template-columns: minmax(0, 1fr); gap: 18px; }
        .r-skel4 { grid-template-columns: minmax(0, 1fr); }

        /* Table fits the viewport instead of scrolling sideways. */
        .r-trow { grid-template-columns: var(--cols-m, var(--cols)); }
        .r-twrap { min-width: 0; }
        .r-tscroll { height: 68vh; }
        /* These cells are styled inline, so overriding them needs !important.
           Remove once the inline styles move into classes (see audit Q5). */
        .r-trow > * { padding-left: 9px !important; padding-right: 9px !important; }
        .r-thead > * { font-size: 9px !important; letter-spacing: .03em !important; }

        .r-cmp-row { grid-template-columns: 108px repeat(var(--cmp-n), minmax(136px, 1fr)); }

        /* Utility: drop non-essential chrome on the smallest screens. */
        .r-hide-sm { display: none !important; }
      }
    </style>
  </head>

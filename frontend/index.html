    <style>
      /* ============================================================
         "LIME" DESIGN SYSTEM — see STYLE_GUIDE.md (single source of truth)
         Light is default; [data-theme="dark"] inverts.
         UI 2.0: light = "Olive wash", dark = "Ink field".
         ============================================================ */
      /* The nav card keeps the same look in both themes — only its surface and
         the ticker band flip — so its text colours are theme-independent and
         cannot inherit --ink, which is cream on the ink field. */
      :root {
        --nav-ink: #16170F;
        --nav-sub: #6F6D5F;
        /* Was #A3A88F — 2.25:1 light, 2.13:1 dark: the worst contrast in the app, and
           on the masthead ("Norway GPFG · Equity Holdings · <date>"). Because this token
           is shared by both themes, one value has to clear all four nav backgrounds;
           this does, at 5.01-5.77:1. Hue and saturation unchanged. */
        --nav-soft: #646851;
        --nav-accent-text: #6C8118;
      }

      :root[data-theme="light"] {
        /* — canonical Lime tokens — OLIVE WASH */
        --bg: #E3E8CE;
        --surface: #FFFFFF;
        --line: #E3E8D3;
        /* Bar rails read as the card border, not a separate grey. */
        --track: #E3E8D3;

        --ink: #16170F;
        /* Was #6F6D5F — 4.15:1 on --bg, a marginal AA failure alongside --soft below.
           Hue and saturation unchanged; now 5.03:1 on --bg. */
        --sub: #626054;
        /* Secondary text: eyebrows, captions, table meta — mostly 9-11px, so WCAG's
           4.5:1 "normal text" bar applies, not the 3:1 large-text one. #A3A88F scored
           1.95:1 on --bg, which is close to invisible with low vision or in sunlight.
           Hue (72deg) and saturation (13%) are unchanged — only lightness moved — so
           the palette keeps its character. Now 5.02:1 on --bg, 5.78 on --row-hover,
           6.31 on --surface. Re-check all three if any of those backgrounds change. */
        --soft: #5E624C;

        --accent: #D8F34A;
        --accent-text: #6C8118;

        --feature: #14150F;
        --feature-ink: #F4F2EC;
        --feature-sub: #8F9180;
        --feature-num: #D8F34A;

        --row-hover: #F4F6EA;
        --card-hover-border: #16170F;

        /* Nav shell — the floating card sits above the olive field. */
        --nav-surface: #FFFFFF;
        --nav-line: #E3E8D3;
        --nav-field: #F4F6EA;
        --nav-band: #16170F;
        --nav-band-ink: #8F9180;
        --tick-up: #9BE04A;
        --tick-down: #FF7A6B;

        /* Shimmer across the total-holdings figure: lime → white → lime. */
        --shimmer: linear-gradient(100deg, #D8F34A 30%, #FFFFFF 50%, #D8F34A 70%);
        --page-glow: none;

        /* Hero card carries its own surface so it can stay cream on the ink
           field (spec 02B) without dragging the other cards with it. */
        --hero-surface: #FFFFFF;
        --hero-line: #E3E8D3;
        --hero-ink: #16170F;
        --hero-sub: #6F6D5F;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #16170F;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        /* Crown Ridge logo — its own palette, kept separate from --accent on
           purpose. The mark is the brand; lime stays the UI accent. On a light
           ground the tile is solid dark and needs no edge. */
        --logo-tile: #16181B;
        --logo-stroke: transparent;
        --logo-crown: #F7F6F2;
        --logo-gold: #C9A227;
      }

      :root[data-theme="dark"] {
        /* — canonical Lime tokens — INK FIELD */
        --bg: #14150F;
        --surface: #1D1F14;
        --line: #2C2E20;
        --track: #2C2E20;

        --ink: #F4F2EC;
        --sub: #95978A;
        /* Same fix as the light theme, lightened instead of darkened. #6E7060 scored
           3.04:1 on --row-hover. Hue (67deg) and saturation (8%) unchanged.
           Now 5.02:1 on --row-hover, 5.44 on --surface, 5.99 on --bg. */
        --soft: #929583;

        --accent: #D8F34A;
        --accent-text: #D8F34A;

        /* Total-holdings card flips to a solid lime fill with ink numerals. */
        --feature: #D8F34A;
        --feature-ink: #14150F;
        --feature-sub: #5A6B12;
        --feature-num: #14150F;

        --row-hover: #23261A;
        --card-hover-border: #D8F34A;

        /* Nav shell — the floating card stays cream so nav + band read as one
           card in both themes; only the surfaces flip. */
        --nav-surface: #FFFDF7;
        --nav-line: #E3E8D3;
        --nav-field: #F2EFE4;
        --nav-band: #D8F34A;
        --nav-band-ink: #2C3505;
        --tick-up: #15490A;
        --tick-down: #8E1104;

        /* Shimmer across the total-holdings figure: ink → white → ink. */
        --shimmer: linear-gradient(100deg, #14150F 30%, #FFFFFF 50%, #14150F 70%);
        --page-glow: radial-gradient(90% 60% at 85% -10%, rgba(216,243,74,.13), transparent 60%);

        --hero-surface: #FFFDF7;
        --hero-line: #FFFDF7;
        --hero-ink: #16170F;
        --hero-sub: #6F6D5F;

        --sector-tech: #60A5FA;
        --sector-financials: #D6E134;
        --sector-healthcare: #2DD4BF;
        --sector-energy: #FB923C;
        --sector-industrials: #A78BFA;
        --sector-consumer: #F472B6;
        --sector-utilities: #FBBF24;
        --sector-realestate: #4ADE80;

        --bull: #4ADE80;
        --bear: #F87171;

        --treemap-cell-fg: #14150F;

        --font-display: 'Space Grotesk', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        /* On the onyx ground the tile would disappear, so it darkens slightly
           and takes a hairline edge — this is logo/crown-ridge-dark.svg. */
        --logo-tile: #0F1113;
        --logo-stroke: #2B2F33;
        --logo-crown: #F7F6F2;
        --logo-gold: #C9A227;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
        line-height: 1.5;
        transition: background .25s, color .25s;
      }
      /* One soft lime glow over the ink field; `none` on the olive wash. */
      body::before {
        content: '';
        position: fixed; inset: 0; z-index: 0;
        background: var(--page-glow);
        pointer-events: none;
      }
      #app { position: relative; z-index: 1; }

      .display { font-family: var(--font-display); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      .display-italic { font-style: italic; }
      .eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--soft); font-weight: 500; }
      .mono { font-family: var(--font-mono); }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      svg { display: block; }

      /* ============================================================
         ANIMATION SET (spec §06) — seven motions, nothing else.
         Reduced-motion overrides live in the media query further down.
         ============================================================ */

      /* 1 · Ticker marquee — content is duplicated once, so −50% loops seamlessly. */
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .tick-track { display: flex; width: max-content; animation: marquee 22s linear infinite; }
      .tick-band:hover .tick-track { animation-play-state: paused; }

      /* 2 · Total-holdings shimmer — gradient clipped to the numerals. */
      @keyframes sweep { 0% { background-position: -140% 0; } 60%, 100% { background-position: 240% 0; } }
      .shimmer {
        background-image: var(--shimmer);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: sweep 5s 1s infinite;
      }

      /* 4 · Nav condense on scroll — --nav-h is set from topbar.jsx (68 → 56).
         Below 900px the bar wraps to two rows, so it sizes to its content. */
      .nav-shell {
        height: var(--nav-h);
        transition: height .32s cubic-bezier(.2,.7,.3,1), border-radius .32s cubic-bezier(.2,.7,.3,1);
        /* The marquee leaves .tick-track a permanent stacking context, and the
           band is a later sibling — without this the scrolling tickers paint
           over the search dropdown that hangs down from the bar. */
        position: relative;
        z-index: 1;
      }
      .tick-band { transition: height .32s cubic-bezier(.2,.7,.3,1), opacity .2s linear; }

      /* 5 · Card entry — once on mount, staggered 60ms per card via --i. */
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }
      .enter {
        animation: cardIn 600ms cubic-bezier(.2,.7,.3,1) both;
        animation-delay: calc(var(--i, 0) * 60ms);
      }

      /* 6 · Card hover — lift plus a soft shadow; no shadow at rest. */
      .lift { transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease, border-color .25s ease; }
      .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 34px -22px rgba(22,23,15,.55); }

      /* 7 · Live dot. */
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: .35; transform: scale(.7); }
      }
      .live-dot {
        width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        background: var(--accent);
        animation: pulseDot 1.8s infinite;
      }

      @keyframes pipeShimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(400%);  }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Visually hidden but exposed to screen readers. */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      /* Skip link — first tab stop, becomes visible on focus. */
      .skip-link {
        position: absolute; left: 8px; top: -60px; z-index: 200;
        padding: 10px 16px; border-radius: 8px;
        background: var(--accent); color: #1B1A17;
        font-family: var(--font-mono); font-size: 13px; text-decoration: none;
        transition: top .15s ease;
      }
      .skip-link:focus { top: 8px; }

      /* Always show a focus ring for keyboard users. */
      :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

      /* WCAG 2.2 — respect the OS "reduce motion" setting.
         Marquee, shimmer and card entry stop outright; hover and the nav
         condense drop to 0ms (spec §06). */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
          scroll-behavior: auto !important;
        }
        /* The shimmer clips its colour to a moving gradient, so with the
           animation stopped the numerals need a solid fill to stay legible. */
        .shimmer {
          background-image: none;
          -webkit-text-fill-color: currentColor;
          color: var(--feature-num);
        }
        .lift:hover { transform: none; box-shadow: none; }
      }

      /* ============================================================
         RESPONSIVE LAYOUT
         Components style themselves with inline style={{}} objects,
         which cannot express media queries. So every grid whose COLUMN
         COUNT changes with viewport lives here as a class instead.
         Breakpoints: 900px (tablet) · 640px (phone).
         Anything that does not change with viewport stays inline.
         ============================================================ */

      /* Hero bento — summary.jsx. Hero row is hero card + total holdings
         (spec §05 "1fr 380px", held as 2:1 so it scales with the page),
         then a 3-up stat row underneath. */
      .r-bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(118px, auto); gap: 16px; }
      .r-bento-lead { grid-column: span 2; }
      .r-bento-feature { grid-column: span 1; }

      /* Two-pane split — top holdings beside the sector treemap */
      .r-split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }

      /* Metric groups — summary.jsx + detail.jsx */
      .r-metrics3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .r-kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; }
      /* Added / removed columns — changes.jsx */
      .r-changes2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

      /* Filter strip, top bar, detail price block, loading skeleton */
      .r-filterbar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
      .r-topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
      /* Phone-only nav pieces. Rendered at every width so the breakpoint stays here
         rather than in a JS media listener, and hidden until the phone rules below. */
      .r-nav-mobile, .r-nav-menu { display: none; }
      .r-priceblock { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: flex-end; }
      .r-skel4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }

      /* Data table. Column templates are computed in JS because the visible
         columns are user-configurable, then handed to CSS as custom properties
         so the BREAKPOINT still lives here rather than in a JS media listener.
         --cols = fixed px (desktop) · --cols-m = minmax()/fr (phone). */
      .r-trow { display: grid; grid-template-columns: var(--cols); }
      .r-twrap { min-width: var(--tmin); position: relative; }
      .r-tscroll { height: 640px; overflow: auto; position: relative; }

      /* Compare modal — label column stays put while companies scroll. */
      .r-cmp-row { display: grid; grid-template-columns: 180px repeat(var(--cmp-n), minmax(180px, 1fr)); }
      .r-cmp-label { position: sticky; left: 0; z-index: 2; background: var(--bg); }

      @media (max-width: 900px) {
        .r-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .r-bento-lead { grid-column: span 2; }
        .r-bento-feature { grid-column: span 2; }
        .r-split { grid-template-columns: minmax(0, 1fr); }
        .r-skel4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        /* Brand and actions share row 1; search gets its own full-width row.
           The brand column is 1fr rather than auto so it can shrink below its
           content instead of pushing the whole bar past the viewport. */
        .r-topbar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand actions" "search search"; row-gap: 12px; }
        .r-brand { grid-area: brand; min-width: 0; }
        .r-brand > div { min-width: 0; overflow: hidden; }
        .r-search { grid-area: search; min-width: 0; }
        .r-actions { grid-area: actions; }
        /* Two rows will not fit the condensed height, so the shell sizes to
           its content and supplies the vertical padding itself. */
        .nav-shell { height: auto !important; padding: 12px 0; }
      }

      @media (max-width: 640px) {
        .r-bento { grid-template-columns: minmax(0, 1fr); }
        .r-bento-lead, .r-bento-feature { grid-column: span 1; }
        .r-metrics3 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .r-kv2 { grid-template-columns: minmax(0, 1fr); }
        .r-changes2 { grid-template-columns: minmax(0, 1fr); gap: 22px; }
        .r-filterbar { grid-template-columns: minmax(0, 1fr); gap: 10px; }

        .r-twrap { min-width: 0; }

        /* These cells are styled inline, so overriding them needs !important.

        .r-thead > * { font-size: 9px !important; letter-spacing: .03em !important; }

        .r-cmp-row { grid-template-columns: 108px repeat(var(--cmp-n), minmax(136px, 1fr)); }

        /* Nav collapses to ONE line: brand, then a search toggle and a menu button.

        .r-topbar { grid-template-areas: "brand actions"; gap: 10px; }

        .r-topbar.search-open .r-search { display: block; }
        .r-nav-menu { display: block; }
        /* The eyebrow is the brand block's second line — dropping it is what makes

           "Equity Holdings" are already hidden at this width by .r-hide-sm. */
        .r-brand .eyebrow { display: none !important; }
        .nav-shell { padding: 10px 0 !important; }

        /* Utility: drop non-essential chrome on the smallest screens. */
        .r-hide-sm { display: none !important; }
